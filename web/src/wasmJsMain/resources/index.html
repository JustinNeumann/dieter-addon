<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#121214">
<title>Dieter</title>
<style>
  :root { --dieter-bg: #121214; --dieter-fg: #8e8e96; }
  :root.light { --dieter-bg: #fbfbfd; --dieter-fg: #6e6e76; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--dieter-bg); }
  /* Compose scrolls and drags itself: a browser that took over a pan (iPadOS does, mid-swipe) would cancel it */
  #dieter { position: fixed; inset: 0; touch-action: pinch-zoom; }
  #loading { position: fixed; inset: 0; z-index: 1; display: grid; place-items: center; padding: 16px;
    font: 500 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--dieter-fg);
    text-align: center; }
  #loading .box { max-width: 420px; }
  #loading .spinner { width: 22px; height: 22px; margin: 0 auto 12px; border-radius: 50%;
    border: 2px solid currentColor; border-right-color: transparent; opacity: .7;
    animation: spin .9s linear infinite; }
  #loading.failed .spinner { display: none; }
  #loading a { color: inherit; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #loading .spinner { animation: none; } }
</style>
<script>
/* Loader of Dieter's Compose UI (Kotlin/Wasm).
   Behind Home Assistant Ingress the page lives at /api/hassio_ingress/<token>/next/ and every asset
   URL is relative, so the trailing slash matters (same guard as the add-on's root page). */
(function () {
  "use strict";
  var path = location.pathname;
  if (!path.endsWith("/") && !/\.html?$/.test(path)) {
    location.replace(path + "/" + location.search + location.hash);
    return;
  }

  // ---- Standalone demo outer Home Assistant shell (?ha=1, or data-ha-demo unless ?ha=0).
  // Renders HA's left sidebar around an Ingress-style iframe so the demo and recordings show Dieter in its HA frame.
  var searchParams = new URLSearchParams(location.search);
  var haParam = searchParams.get("ha");
  var showHaShell = window.parent === window &&
    (haParam === "1" || haParam === "true" || (document.documentElement.hasAttribute("data-ha-demo") && haParam !== "0"));
  if (showHaShell) {
    var mountHaShell = function () {
      var html = document.documentElement;
      html.style.setProperty("--primary-color", "#03a9f4");
      html.style.setProperty("--accent-color", "#ff9800");
      html.style.setProperty("--primary-background-color", "#111114");
      html.style.setProperty("--secondary-background-color", "#1c1c21");
      html.style.setProperty("--card-background-color", "#1c1c21");
      html.style.setProperty("--primary-text-color", "#e1e1e6");
      html.style.setProperty("--sidebar-background-color", "#141418");
      var style = document.createElement("style");
      style.textContent = [
        "home-assistant { position: fixed; inset: 0; display: flex; background: #111114; color: #e1e1e6;",
        "  font: 400 14px/1.4 Roboto, system-ui, -apple-system, 'Segoe UI', sans-serif; user-select: none; }",
        ".ha-sidebar { width: 224px; flex-shrink: 0; background: #141418; border-right: 1px solid rgba(255,255,255,.08);",
        "  display: flex; flex-direction: column; transition: width .18s ease; overflow: hidden; z-index: 2; }",
        ".ha-sidebar.collapsed { width: 56px; }",
        ".ha-brand { height: 56px; display: flex; align-items: center; padding: 0 8px 0 8px; gap: 6px;",
        "  border-bottom: 1px solid rgba(255,255,255,.06); flex-shrink: 0; }",
        ".ha-menu-btn { width: 40px; height: 40px; border: 0; border-radius: 50%; background: transparent;",
        "  color: #9e9ea8; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }",
        ".ha-menu-btn:hover { background: rgba(255,255,255,.06); color: #e1e1e6; }",
        ".ha-logo-badge { width: 28px; height: 28px; border-radius: 7px; background: #18bcf2; color: #fff;",
        "  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 1px 4px rgba(24,188,242,.35); }",
        ".ha-title { font-size: 17px; font-weight: 500; color: #e1e1e6; white-space: nowrap; letter-spacing: .1px; margin-left: 4px; }",
        ".ha-sidebar.collapsed .ha-logo-badge, .ha-sidebar.collapsed .ha-title, .ha-sidebar.collapsed .ha-label, .ha-sidebar.collapsed .ha-badge { display: none; }",
        ".ha-nav { padding: 8px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1; }",
        ".ha-footer { padding: 8px; border-top: 1px solid rgba(255,255,255,.07); display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }",
        ".ha-item { height: 40px; border-radius: 8px; padding: 0 12px; display: flex; align-items: center; gap: 16px;",
        "  color: #9e9ea8; font-size: 14px; font-weight: 500; white-space: nowrap; cursor: pointer; position: relative; }",
        ".ha-sidebar.collapsed .ha-item { padding: 0; justify-content: center; }",
        ".ha-item:hover { background: rgba(255,255,255,.05); color: #e1e1e6; }",
        ".ha-item.active { background: rgba(24,188,242,.16); color: #38bdf8; }",
        ".ha-item svg { width: 22px; height: 22px; flex-shrink: 0; fill: currentColor; }",
        ".ha-badge { margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;",
        "  background: #03a9f4; color: #fff; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; }",
        ".ha-avatar { width: 26px; height: 26px; border-radius: 50%; background: #0288d1; color: #fff;",
        "  font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; margin-left: -2px; }",
        ".ha-panel { flex: 1; height: 100%; position: relative; background: #121214; overflow: hidden; }",
        ".ha-panel iframe { width: 100%; height: 100%; border: 0; display: block; }",
        "@media (max-width: 960px) { .ha-sidebar { width: 56px; } .ha-sidebar .ha-logo-badge, .ha-sidebar .ha-title, .ha-sidebar .ha-label, .ha-sidebar .ha-badge { display: none; } .ha-sidebar .ha-item { padding: 0; justify-content: center; } }"
      ].join("\n");
      document.head.appendChild(style);

      var childParams = new URLSearchParams(location.search);
      childParams.delete("ha");
      if (!childParams.has("demo")) childParams.set("demo", "standalone");
      var childSrc = location.pathname + "?" + childParams.toString() + location.hash;

      var ha = document.createElement("home-assistant");
      ha.hass = { themes: { darkMode: true, theme: "Home Assistant", default_theme: "Home Assistant" } };
      ha.innerHTML = [
        '<aside class="ha-sidebar" id="ha-sidebar" aria-label="Home Assistant sidebar">',
        '  <div class="ha-brand">',
        '    <button class="ha-menu-btn" id="ha-menu-toggle" type="button" aria-label="Toggle Home Assistant sidebar" title="Toggle sidebar">',
        '      <svg viewBox="0 0 24 24"><path d="M3,6H21V8H3V6M3,11H21V13H3V11M3,16H21V18H3V16Z"/></svg>',
        '    </button>',
        '    <span class="ha-logo-badge" aria-hidden="true">',
        '      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3L2 12h3v8h14v-8h3L12 3zm0 4.7c.9 0 1.6.7 1.6 1.6 0 .7-.4 1.3-1.1 1.5v2.6l2.1-2.1c-.1-.2-.1-.5-.1-.7 0-.9.7-1.6 1.6-1.6s1.6.7 1.6 1.6-.7 1.6-1.6 1.6c-.3 0-.5-.1-.7-.2l-2.9 2.9v3.1h-1V14l-2.9-2.9c-.2.1-.4.2-.7.2-.9 0-1.6-.7-1.6-1.6S7 8.1 7.9 8.1s1.6.7 1.6 1.6c0 .2 0 .5-.1.7l2.1 2.1v-1.7c-.7-.2-1.1-.8-1.1-1.5 0-.9.7-1.6 1.6-1.6z"/></svg>',
        '    </span>',
        '    <span class="ha-title">Home Assistant</span>',
        '  </div>',
        '  <nav class="ha-nav">',
        '    <div class="ha-item"><svg viewBox="0 0 24 24"><path d="M13,3V9H21V3M13,21H21V11H13M3,21H11V15H3M3,13H11V3H3V13Z"/></svg><span class="ha-label">Overview</span></div>',
        '    <div class="ha-item"><svg viewBox="0 0 24 24"><path d="M11,15H6L13,1V9H18L11,23V15Z"/></svg><span class="ha-label">Energy</span></div>',
        '    <div class="ha-item"><svg viewBox="0 0 24 24"><path d="M12,11.5A2.5,2.5 0 0,1 9.5,9A2.5,2.5 0 0,1 12,6.5A2.5,2.5 0 0,1 14.5,9A2.5,2.5 0 0,1 12,11.5M12,2A7,7 0 0,0 5,9C5,14.25 12,22 12,22C12,22 19,14.25 19,9A7,7 0 0,0 12,2Z"/></svg><span class="ha-label">Map</span></div>',
        '    <div class="ha-item"><svg viewBox="0 0 24 24"><path d="M3,4H7V8H3V4M9,5V7H21V5H9M3,10H7V14H3V10M9,11V13H21V11H9M3,16H7V20H3V16M9,17V19H21V17H9"/></svg><span class="ha-label">Logbook</span></div>',
        '    <div class="ha-item"><svg viewBox="0 0 24 24"><path d="M22,21H2V3H4V19H6V10H10V19H12V6H16V19H18V14H22V21Z"/></svg><span class="ha-label">History</span></div>',
        '    <div class="ha-item active" id="ha-nav-dieter" aria-current="page"><svg viewBox="0 0 24 24"><path d="M19,3H5C3.89,3 3,3.89 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5C21,3.89 20.1,3 19,3M9,17H7V10H9V17M13,17H11V7H13V17M17,17H15V13H17V17Z"/></svg><span class="ha-label">Dieter</span></div>',
        '    <div class="ha-item"><svg viewBox="0 0 24 24"><path d="M12,3V12.26C11.5,12.09 11,12 10.5,12C8,12 6,14 6,16.5C6,19 8,21 10.5,21C13,21 15,19 15,16.5V6H19V3H12Z"/></svg><span class="ha-label">Media</span></div>',
        '  </nav>',
        '  <div class="ha-footer">',
        '    <div class="ha-item"><svg viewBox="0 0 24 24"><path d="M22.7,19L13.6,9.9C14.5,7.6 14,4.9 12.1,3C10.1,1 7.1,0.6 4.7,1.7L9,6L6,9L1.6,4.7C0.4,7.1 0.9,10.1 2.9,12.1C4.8,14 7.5,14.5 9.8,13.6L18.9,22.7C19.3,23.1 19.9,23.1 20.3,22.7L22.6,20.4C23.1,20 23.1,19.3 22.7,19Z"/></svg><span class="ha-label">Developer Tools</span></div>',
        '    <div class="ha-item"><svg viewBox="0 0 24 24"><path d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.5,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.5,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.96 4.46,5.05 4.34,5.27L2.34,8.73C2.21,8.95 2.27,9.22 2.46,9.37L4.57,11C4.53,11.34 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.21,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.03 4.95,18.95L7.44,17.94C7.96,18.34 8.5,18.68 9.13,18.93L9.5,21.58C9.54,21.82 9.75,22 10,22H14C14.25,22 14.46,21.82 14.5,21.58L14.87,18.93C15.5,18.67 16.04,18.34 16.56,17.94L19.05,18.95C19.27,19.03 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z"/></svg><span class="ha-label">Settings</span><span class="ha-badge">1</span></div>',
        '    <div class="ha-item"><svg viewBox="0 0 24 24"><path d="M21,19V20H3V19L5,17V11C5,7.9 7.03,5.17 10,4.29C10,4.19 10,4.1 10,4A2,2 0 0,1 12,2A2,2 0 0,1 14,4C14,4.1 14,4.19 14,4.29C16.97,5.17 19,7.9 19,11V17L21,19M14,21A2,2 0 0,1 12,23A2,2 0 0,1 10,21"/></svg><span class="ha-label">Notifications</span></div>',
        '    <div class="ha-item"><span class="ha-avatar">A</span><span class="ha-label">Alex</span></div>',
        '  </div>',
        '</aside>',
        '<main class="ha-panel"><iframe id="ha-ingress-frame" title="Dieter"></iframe></main>'
      ].join("\n");
      document.body.innerHTML = "";
      document.body.appendChild(ha);
      var frame = document.getElementById("ha-ingress-frame");
      frame.src = childSrc;
      var sidebar = document.getElementById("ha-sidebar");
      document.getElementById("ha-menu-toggle").addEventListener("click", function () {
        sidebar.classList.toggle("collapsed");
      });
    };
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mountHaShell);
    else mountHaShell();
    return;
  }

  // ---- Home Assistant's theme. Behind Ingress the page is same origin with HA's frontend, so it
  // reads the parent page: hass.themes (dark mode, theme name) and the CSS variables HA applies to its
  // <html>. HA's app-panel messages (home-assistant/properties) carry only narrow and route, no theme.
  // Precedence for dark/light: ?theme=dark|light, then Home Assistant, then the device.
  // window.dieterHost hands the result to the Compose side (WebHost.kt) and tells it about changes.
  var HA_VARS = ["primary-color", "accent-color", "primary-background-color", "secondary-background-color",
    "card-background-color", "primary-text-color", "sidebar-background-color"];
  function haRoot() {
    try {
      if (window.parent === window) return null;
      var root = window.parent.document.querySelector("home-assistant");
      return root && root.hass ? root : null;
    } catch (e) {
      return null; // another origin (no Ingress)
    }
  }
  var probe = null;
  function toHex(value) { // any CSS color -> #rrggbb, null for none/transparent
    if (!value) return null;
    if (!probe) { probe = document.createElement("i"); probe.style.display = "none"; document.documentElement.appendChild(probe); }
    probe.style.color = "";
    probe.style.color = value;
    if (!probe.style.color) return null;
    var m = getComputedStyle(probe).color.match(/rgba?\(\s*(\d+)[ ,]+(\d+)[ ,]+(\d+)(?:\s*[,/]\s*([\d.]+)(%?))?/);
    if (!m || (m[4] !== undefined && parseFloat(m[4]) === 0)) return null;
    return "#" + [m[1], m[2], m[3]].map(function (n) { return ("0" + (+n).toString(16)).slice(-2); }).join("");
  }
  function readTheme() {
    var forced = new URLSearchParams(location.search).get("theme");
    if (forced !== "dark" && forced !== "light") forced = null;
    var root = haRoot();
    var hass = root && root.hass;
    var vars = {};
    if (root) {
      try {
        var cs = window.parent.getComputedStyle(window.parent.document.documentElement);
        HA_VARS.forEach(function (n) { vars[n] = toHex(cs.getPropertyValue("--" + n).trim()); });
      } catch (e) {}
    }
    var themes = hass && hass.themes;
    var dark = forced ? forced === "dark"
      : themes && typeof themes.darkMode === "boolean" ? themes.darkMode
      : !(window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches);
    return {
      dark: dark,
      source: forced ? "query" : hass ? "home-assistant" : "device",
      name: (themes && (themes.theme || themes.default_theme)) || null,
      primary: vars["primary-color"] || null,
      accent: vars["accent-color"] || null,
      background: vars["primary-background-color"] || null,
      surface: vars["card-background-color"] || null,
      text: vars["primary-text-color"] || null,
      sidebar: vars["sidebar-background-color"] || null,
    };
  }
  function storage(key, value) {
    try {
      if (value === undefined) return window.localStorage.getItem(key);
      window.localStorage.setItem(key, value);
    } catch (e) {}
    return null;
  }
  // The loader and the browser chrome take the colour Compose drew last time in this mode (no flash).
  function applyChrome(dark, color) {
    var bg = color || storage("dieter.chrome." + (dark ? "dark" : "light")) || (dark ? "#121214" : "#fbfbfd");
    var html = document.documentElement;
    html.classList.toggle("light", !dark);
    html.style.setProperty("--dieter-bg", bg);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", bg);
  }
  var current = readTheme();
  var currentJson = JSON.stringify(current);
  var listeners = [];
  var pending = null;
  var watching = false;
  applyChrome(current.dark);
  function check() {
    pending = null;
    var next = readTheme();
    var json = JSON.stringify(next);
    if (json === currentJson) return;
    current = next;
    currentJson = json;
    if (document.getElementById("loading")) applyChrome(next.dark);
    listeners.slice().forEach(function (cb) { try { cb(); } catch (e) {} });
  }
  function schedule() { if (!pending) pending = setTimeout(check, 100); }
  function watch() {
    if (watching) return;
    watching = true;
    try {
      var parentDoc = window.parent !== window ? window.parent.document : null;
      if (parentDoc) {
        var Observer = window.parent.MutationObserver;
        new Observer(schedule).observe(parentDoc.documentElement, { attributes: true, attributeFilter: ["style", "class"] });
        new Observer(schedule).observe(parentDoc.head, { childList: true, subtree: true, characterData: true });
      }
    } catch (e) {}
    [window, window.parent].forEach(function (w) {
      try { w.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", schedule); } catch (e) {}
    });
    document.addEventListener("visibilitychange", function () { if (!document.hidden) schedule(); });
    window.addEventListener("focus", schedule);
    setInterval(function () { if (!document.hidden) check(); }, 1000); // hass.themes can change without a DOM change
  }
  // ---- where the gateway should send this browser back after GitHub sign-in. Inside Home Assistant's
  // frontend: <HA address>/app/<add-on slug>/next/signin (the add-on's root page forwards that deep link to
  // next/signin, which the bridge relays to the web host). Elsewhere: this page's own address.
  function signInCallback() {
    try {
      if (window.parent !== window) {
        var p = window.parent.location;
        var m = p.pathname.match(/^\/(?:app\/|hassio\/ingress\/)?((?:[0-9a-f]{8}|local)_[a-z0-9_]+)(?:\/|$)/);
        if (m) return p.origin + "/app/" + m[1] + "/next/signin";
      }
    } catch (e) {}
    return location.origin + location.pathname.replace(/[^/]*$/, "") + "signin";
  }
  window.dieterHost = {
    signInCallback: signInCallback,
    theme: function () { check(); return currentJson; },
    onThemeChange: function (callback) { listeners.push(callback); watch(); },
    setChrome: function (color, dark) {
      storage("dieter.chrome." + (dark ? "dark" : "light"), color);
      applyChrome(dark, color);
    },
  };

  function loading() { return document.getElementById("loading"); }
  function fail(html) {
    var run = function () {
      var el = loading();
      if (!el) return;
      el.classList.add("failed");
      el.querySelector(".text").innerHTML = html;
    };
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", run); else run();
  }
  var RELOAD = '<a href="./" target="_self">Reload</a> to try again.';

  // ---- Kotlin/Wasm needs WebAssembly GC (Chrome/Edge 119+, Firefox 120+, Safari and iOS 18.2+)
  function wasmGcSupported() {
    try {
      // a module whose type section declares one struct type (GC proposal)
      return typeof WebAssembly === "object" &&
        WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0]));
    } catch (e) {
      return false;
    }
  }
  if (!wasmGcSupported()) {
    fail("This browser cannot run Dieter: it needs WebAssembly GC " +
      "(current Chrome, Edge or Firefox; Safari, iPhone and iPad from iOS 18.2).");
    return;
  }

  // ---- compressed WebAssembly: Home Assistant's Ingress drops Accept-Encoding and compresses only
  // text, JSON and JavaScript at the border, so the ~14 MB of .wasm would travel uncompressed.
  // The bundle ships X.wasm.gz next to X.wasm; fetch the .gz and inflate it in the browser.
  var nativeFetch = window.fetch.bind(window);
  if (typeof DecompressionStream === "function" && typeof Response === "function") {
    window.fetch = function (input, init) {
      var url = typeof input === "string" ? input : (input && (input.href || input.url));
      if (url && /\.wasm(\?|$)/.test(url)) {
        var gz = url.replace(/\.wasm(\?|$)/, ".wasm.gz$1");
        return nativeFetch(gz, init).then(function (r) {
          if (!r.ok || !r.body) return nativeFetch(input, init);
          return new Response(r.body.pipeThrough(new DecompressionStream("gzip")), {
            status: 200,
            headers: { "Content-Type": "application/wasm" },
          });
        }, function () {
          return nativeFetch(input, init);
        });
      }
      return nativeFetch(input, init);
    };
  }

  // ---- once the first frame is drawn (Browser.kt hideLoading): one line in the add-on log with how long the start
  // took on this device and which of the page's files came over the network (the Companion app's WebView keeps
  // only a small cache). Not in the demo.
  window.dieterLoaded = function () {
    var ms = Math.round(performance.now());
    if (/[?&]demo(=|&|$)/.test(location.search) || !performance.getEntriesByType) return;
    try {
      var base = new URL("./", location.href).href;
      var files = performance.getEntriesByType("navigation").concat(performance.getEntriesByType("resource"))
        .filter(function (e) { return e.name.indexOf(base) === 0; })
        .map(function (e) {
          var name = e.name.slice(base.length).split(/[?#]/)[0] || "index.html";
          return { name: name, transfer: e.transferSize || 0, size: e.encodedBodySize || 0 };
        });
      var host = location.hostname;
      var where = /\.ui\.nabu\.casa$/.test(host) ? "nabu"
        : /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|127\.)|\.local$|^localhost$/.test(host) ? "local" : "other";
      // the page is in next/, the add-on's API beside it (PanelRoutes.kt)
      nativeFetch(new URL("../api/page-load", location.href).href, {
        method: "POST", keepalive: true, headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ms: ms, client: navigator.userAgent, where: where,
          downlink: navigator.connection && navigator.connection.downlink, files: files }),
      }).catch(function () {});
    } catch (e) {}
  };

  // ---- errors before the first frame end up on the loader instead of a blank page
  function startupError(message) {
    if (!loading() || window.dieterStarted) return;
    fail("Dieter could not start: " + String(message || "unknown error")
      .replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }) + ". " + RELOAD);
  }
  window.addEventListener("error", function (e) { startupError(e.message || (e.error && e.error.message)); });
  window.addEventListener("unhandledrejection", function (e) {
    startupError(e.reason && (e.reason.message || e.reason));
  });

  // ---- the bundle (tools/package.sh rewrites the name to the content-hashed one)
  var script = document.createElement("script");
  script.src = "dieter.js";
  script.onerror = function () { startupError("the bundle did not load"); };
  document.head.appendChild(script);
})();
</script>
</head>
<body>
<div id="loading" role="status" aria-live="polite"><div class="box"><div class="spinner"></div><div class="text">Loading Dieter…</div></div></div>
<div id="dieter"></div>
</body>
</html>
