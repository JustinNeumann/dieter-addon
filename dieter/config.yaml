# Dieter coding agents as a Home Assistant add-on. Runs the Dieter daemon (store /data/dieter) and the
# bridge (bridge/dieter_bridge.py) that serves the page behind Ingress and the HA sensors.
# Version: <bundled Dieter release>.<add-on revision>; bump it for every change that should reach
# installs (the Supervisor pulls image:<version> built by .github/workflows/builder.yaml). For a local
# build on the device (DEPLOY.md) drop the image: line, otherwise the Supervisor pulls instead of building.
name: Dieter
version: "0.6.429.20"
slug: dieter
description: Dieter coding agents (daemon + page) behind Home Assistant Ingress
url: https://github.com/JustinNeumann/dieter-addon
image: ghcr.io/justinneumann/dieter
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:robot
panel_title: Dieter
homeassistant_api: true   # HA events (notifications) and the agents' hass-cli go through the core proxy
hassio_api: false
host_network: false
options:
  git_user: ""
  git_email: ""
  github_token: ""
  claude_code_oauth_token: ""
  openai_api_key: ""
  antigravity_token: ""
  gateway_url: ""
  gateway_host_ip: ""
  machine_name: "home-assistant"
  projects: []
  log_level: info
schema:
  git_user: str?
  git_email: str?
  github_token: password?
  claude_code_oauth_token: password?
  openai_api_key: password?
  antigravity_token: password?
  gateway_url: str?
  gateway_host_ip: str?
  machine_name: str?
  projects:
    - name: str
      git_url: str
      branch: str?
  log_level: list(debug|info|warning)?
backup_exclude:
  - "dieter/runtime/harness/**"
  - "projects/**"
