configuration:
  git_user:
    name: Git user name
    description: Commit author name used by the agents.
  git_email:
    name: Git e-mail
    description: Commit author e-mail used by the agents.
  github_token:
    name: GitHub token
    description: Fine-grained token with contents read/write on the project repositories (clone, push).
  claude_code_oauth_token:
    name: Claude Code token
    description: Optional. Long-lived token from `claude setup-token`. Such tokens cannot read your quota; signing in on the Dieter page (Tools → Usage → Sign in) is the fuller alternative and takes precedence.
  openai_api_key:
    name: OpenAI API key
    description: Used by the Codex harness (API-key mode).
  antigravity_token:
    name: Antigravity credentials
    description: "Sign-in file of the Antigravity CLI (JSON). On a computer where `agy` is signed in, run: cat \"$HOME/.gemini/antigravity-cli/antigravity-oauth-token\" and paste the output here."
  gateway_mode:
    name: Gateway mode
    description: "Choose `embedded` (default) to run a local gateway inside the add-on with automatic enrollment and pairing (standalone, no external gateway or GitHub OAuth app needed), or `external` to connect to a remote Dieter gateway (`gateway_url`) shared with mobile/desktop apps. You can switch between `embedded` and `external` at any time without losing either mode's enrollment or device trust."
  gateway_url:
    name: External gateway URL
    description: "Optional (used when Gateway mode is `external`). HTTPS origin of your remote Dieter gateway, e.g. https://gateway.example.net:4443."
  gateway_host_ip:
    name: External gateway host IP
    description: "Optional. Pins the hostname of `gateway_url` in `/etc/hosts` when the container cannot resolve it (e.g. a Tailscale hostname)."
  machine_name:
    name: Machine name
    description: "How this Home Assistant add-on's daemon appears in Dieter (default: home-assistant)."
  web_sign_in_callback:
    name: New page sign-in address
    description: "Optional. Where your Dieter gateway sends the browser back after GitHub sign-in on the new page, e.g. https://<your Home Assistant address>/app/<this add-on's slug>/next/signin. Empty: the address you opened Home Assistant with. The gateway must list it in DIETER_NATIVE_REDIRECT_URIS."
  api_key:
    name: API key
    description: "Optional. Lets a caller other than Home Assistant itself use the add-on's Home Assistant routes (sensor, new card, follow-up, move, focus) with the header Authorization: Bearer <key>, e.g. dieter_task.py from the SSH add-on. Empty: only Home Assistant (and its Ingress) can call the add-on."
  agents_home_assistant:
    name: Home Assistant for every task
    description: "Gives every agent hass-cli and ha-logs, signed in with the add-on's token. Home Assistant treats that token as its Supervisor user, an administrator: the agents can then call any service, including this add-on's rest_commands (send a message into any card as you, create and start a task, move a card), and read every state and event. Off: only tasks, chats and schedules created with \"Allow Home Assistant access\" reach Home Assistant, each turn checked by the add-on; the add-on's notifications and titles keep working."
  projects:
    name: Projects
    description: "Repositories to clone into /data/projects and register with Dieter: name, git_url, branch (optional)."
  log_level:
    name: Log level
    description: Log level (debug adds the web host's core debug lines).
