# The page can build with a newer Compose Multiplatform than the fork's apps (fork/apps/kotlin). 1.13 keeps the
# accessibility tree of every open layer, where 1.12 leaves a closed popup's nodes for screen readers until a reload,
# but 1.13.0-beta01's new text input (a contenteditable instead of a textarea) loses or reorders a keyboard's keys
# once a field that changed is tapped again (docs/PLAN.md, open issues). The page stays on the fork's 1.12 until a
# 1.13 build types reliably; tests/popups.spec.ts expects the screen readers' gap while it does.
#composeWebVersion=1.13.0-beta01
