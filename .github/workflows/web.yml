# Builds the Compose web bundle (:web, Kotlin/Wasm) on every push and pull request; a tag vX.Y.Z
# publishes dieter-web-X.Y.Z.tar.gz + SHA256SUMS as a GitHub release. The add-on
# (JustinNeumann/dieter-addon, dieter/Dockerfile) pins the tarball by version and sha256.
name: Web bundle

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the release on tags
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.0.0-${GITHUB_SHA::8}"; fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "bundle version ${v}, dieter $(git -C dieter rev-parse --short HEAD)"

      - name: Build the web bundle
        run: ./gradlew --console=plain :web:wasmJsBrowserDistribution
        env:
          DIETER_WEB_VERSION: ${{ steps.version.outputs.version }}

      - name: Package
        run: |
          sudo apt-get install -y -qq brotli >/dev/null
          tools/package.sh "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: dieter-web-${{ steps.version.outputs.version }}
          path: |
            build/package/dieter-web-*.tar.gz
            build/package/SHA256SUMS

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.version.outputs.version }}"
          notes="Compose web bundle ${v} (Dieter $(git -C dieter rev-parse --short HEAD)). sha256: $(cut -d' ' -f1 build/package/SHA256SUMS)"
          gh release create "${GITHUB_REF_NAME}" build/package/dieter-web-${v}.tar.gz build/package/SHA256SUMS \
            --title "dieter-web ${v}" --notes "${notes}"
