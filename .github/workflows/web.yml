# Builds the Compose web bundle (:web, Kotlin/Wasm) and the web host (:host, JVM) on every push and pull
# request; a tag vX.Y.Z publishes dieter-web-X.Y.Z.tar.gz, dieter-web-host-X.Y.Z.jar and SHA256SUMS as a
# GitHub release. The add-on (JustinNeumann/dieter-addon, dieter/Dockerfile) pins both by version and sha256.
name: Web bundle

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the release on tags
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # npm builds the offline diagram renderer (dieter/apps/apple/mac/MarkdownPreview) into the bundle.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.0.0-${GITHUB_SHA::8}"; fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "bundle version ${v}, dieter $(git -C dieter rev-parse --short HEAD)"

      - name: Build the web bundle and the web host, test the host
        run: ./gradlew --console=plain :web:wasmJsBrowserDistribution :host:jvmTest :host:fatJar
        env:
          DIETER_WEB_VERSION: ${{ steps.version.outputs.version }}

      - name: Package
        run: |
          sudo apt-get install -y -qq brotli >/dev/null
          v="${{ steps.version.outputs.version }}"
          tools/package.sh "${v}"
          cp "host/build/libs/dieter-web-host-${v}.jar" build/package/
          (cd build/package && sha256sum "dieter-web-${v}.tar.gz" "dieter-web-host-${v}.jar" > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: dieter-web-${{ steps.version.outputs.version }}
          path: |
            build/package/dieter-web-*.tar.gz
            build/package/dieter-web-host-*.jar
            build/package/SHA256SUMS

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.version.outputs.version }}"
          notes="Compose web bundle and web host ${v} (Dieter $(git -C dieter rev-parse --short HEAD)).

          \`\`\`
          $(cat build/package/SHA256SUMS)
          \`\`\`"
          gh release create "${GITHUB_REF_NAME}" build/package/dieter-web-${v}.tar.gz build/package/dieter-web-host-${v}.jar build/package/SHA256SUMS \
            --title "dieter-web ${v}" --notes "${notes}"

  browser-tests:
    # Selection, find, HTML islands and keyboard checks (tests/, Playwright) against the packaged bundle.
    name: Browser tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: dieter-web-${{ needs.build.outputs.version }}
          path: build/package

      - name: Unpack the bundle
        run: tar xzf build/package/dieter-web-${{ needs.build.outputs.version }}.tar.gz -C build/package

      - name: Install Playwright
        working-directory: tests
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Test
        working-directory: tests
        env:
          DIETER_WEB_DIR: ${{ github.workspace }}/build/package/dieter-web-${{ needs.build.outputs.version }}
        run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            tests/playwright-report
            tests/test-results
